name: GithubAction2

on:
  push:
    branches: 
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Intialize Repo
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v3
        with: 
        node-version: 16
      
      - name: install dependencies
        run: npm install

      - name: run tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicddemo:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicddemo:latest